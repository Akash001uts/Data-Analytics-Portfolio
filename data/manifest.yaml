# Data manifest for the avoidable hospital admissions project.
# Raw files are never committed. `dap health fetch` downloads each entry to data/raw/<id>/<file>,
# checks bytes and sha256, and fails with an "upstream changed" error on a mismatch.
# Recorded 2026-10-06 when I first checked the sources; PHIDU entries re-pinned 2026-10-07 to the September 2026 release.
# See projects/avoidable-hospitalisations/data.md for how each source is used.

