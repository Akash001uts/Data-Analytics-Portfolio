  # Live API: responses change over time, so these are pinned by data set ID and record counts, not by hash.
  # fetch saves the JSON with a retrieval timestamp and fails if the counts move outside the tolerance.
  - id: myhospitals_reporting_units
    title: MyHospitals Data API, reporting units (hospital locations and public/private flag)
    publisher: AIHW
    url: https://myhospitalsapi.aihw.gov.au/api/v1/reporting-units
    file: reporting_units.json
    accept: application/json   # without this the API returns CSV
    volatile: true
    expect:
      reporting_units: 1428
      hospitals: 1166
      hospitals_open_public: 692
      hospitals_missing_coordinates: 46
      tolerance_pct: 5
    licence: CC BY 3.0 (as stated in the API's swagger info, linking to aihw.gov.au/copyright)
    used_for: [distance_to_public_hospital]

