# Uses the project's own ruff through uv, so the hook and CI always run the same version.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: no-large-data
        name: no data files outside tests/fixtures
        entry: data files belong in data/raw (gitignored), not in git
        language: fail
        files: \.(xlsx|xls|zip|parquet|gpkg|shp|csv)$
        # RoBERTa's cached predictions are an output (review ids and probabilities, no text)
        exclude: ^(tests/fixtures/|reports/sentiment/roberta_predictions\.csv$)
